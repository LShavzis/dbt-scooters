models:  
  - name: trips_stat
    description: "Basic trips statistics totals for 3 months of data"
    columns:
      - name: trips
        description: "Total count of trips"
        data_tests:
          - not_null
      - name: users
        description: "Unique number of users"
        data_tests:
          - not_null
      - name: avg_duration_m
        description: "Average trip duration in minutes"
        data_tests:
          - not_null
      - name: revenue_rub
        description: "Total revenue in rubles"
        data_tests:
          - not_null
      - name: free_trips_pct
        description: "Percentage of free trips"
        data_tests:
          - not_null
      - name: sum_distance_km
        description: "Total distance of trips in kilometers"
        data_tests:
          - not_null

  - name: trips_stat_daily
    description: "Daily aggregates of main metrics for 3 months of data"
    columns:
      - name: date
        description: "Date of the daily aggregate"
        data_tests:
          - not_null
          - unique
      - name: trips
        description: "Total count of trips"
        data_tests:
          - not_null
      - name: max_price_rub
        description: "Maximum trip price in rubles"
        data_tests:
          - not_null
      - name: avg_distance_km
        description: "Average trip distance in kilometers"
        data_tests:
          - not_null
      - name: avg_price_rub_per_min
        description: "Average price per minute in rubles"
        data_tests:
          - not_null
  - name: trips_stat_age.sql
    description: "Average daily trips by age of the user, careful, doesnt cover days with no trips"
    columns:
      - name: age
        description: "Age of the user"
        data_tests:
          - not_null
          - unique
      - name: avg_trips
        description: "Average number of trips per day"
        data_tests:
          - not_null

  - name: trips_prep
    description: "Enriched trips data to be used for creation of analytical models "
    config:
      materialized: view
    columns:
      - name: id
        description: "Trip ID"
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: "User ID"
        data_tests:
          - not_null
      - name: scooter_hw_id
        description: "ID of the scooter"
        data_tests:
          - not_null
      - name: started_at
        description: "Timestamp of the trip start"
        data_tests:
          - not_null 
      - name: finished_at
        description: "Timestamp of the trip end"
        data_tests:
          - not_null
      - name: date
        description: "Date of the trip stard in YYYY-MM-DD format"
        data_tests:
          - not_null      
      - name: start_lat
        description: "Latitude of the trip start"
        data_tests:
          - not_null
      - name: start_lon
        description: "Longitude of the trip start"
        data_tests:
          - not_null
      - name: finish_lat
        description: "Latitude of the trip finish"
        data_tests:
          - not_null
      - name: finish_lon
        description: "Longitude of the trip finish"
        data_tests:
          - not_null
      - name: distance_m
        description: "Distance of the trip in meters"
        data_tests:
          - not_null
      - name: price_rub
        description: "Price of the trip in rubles rounded to 2 decimal places"
        data_tests:
          - not_null
      - name: is_free
        description: "Whether the trip was free or not"
        data_tests:
          - not_null
